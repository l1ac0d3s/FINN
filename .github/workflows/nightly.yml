name: Nightly refresh

on:
  schedule:
    - cron: "30 12 * * 1-5"    # 18:00 IST, Monday to Friday, after the market closes
  workflow_dispatch:           # also runs on demand from the Actions tab

permissions:
  contents: write              # needed to commit the new seed file

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch prices, announcements and quarterly figures
        run: python -m ingest.run_daily --skip-text

      - name: Build the seed file
        run: python -m ingest.make_seed

      - name: Commit the new seed, so Render redeploys with fresh data
        run: |
          git config user.name "finn-nightly"
          git config user.email "finn-nightly@users.noreply.github.com"
          git add seed/seed.sqlite
          if git diff --cached --quiet; then
            echo "No change in the data."
          else
            git commit -m "Nightly data refresh"
            git push
          fi
