<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINN credit scorecard</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root { --blue: #1f3c88; --blue-deep: #14285e; --gold: #c99a2e; --ink: #1d2a44; --muted: #5b6b86;
  --line: #d8dfeb; --paper: #ffffff; --up: #1e7b4a; --down: #b03a2e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #14202f; --ink: #e8edf6; --muted: #9fb0c8; --line: #2b3b55; }
}
:root[data-theme="dark"] { --paper: #14202f; --ink: #e8edf6; --muted: #9fb0c8; --line: #2b3b55; }
body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; color: var(--ink); background: #eef2f9; }
main { max-width: 640px; margin: 0 auto; padding: 16px; }
header { background: var(--blue); color: #fff; border-radius: 14px; padding: 16px; border-bottom: 4px solid var(--gold); }
header h1 { margin: 0; font-size: 20px; font-weight: 600; }
header a { color: #fff; font-size: 13px; }
section { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
h2 { font-size: 15px; margin: 0 0 8px; color: var(--blue-deep); text-transform: uppercase; letter-spacing: 0.05em; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
input { font: inherit; padding: 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: var(--paper); }
button { grid-column: 1 / -1; font: inherit; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: var(--blue); color: #fff; }
.note { font-size: 12px; color: var(--muted); margin: 6px 0; }
.rating { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score { font-size: 32px; font-weight: 600; color: var(--blue-deep); }
.badge { background: var(--gold); color: #1d1500; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
th, td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
svg { width: 100%; height: auto; margin-top: 6px; }
ul { padding-left: 18px; font-size: 13px; color: var(--muted); }
@media (max-width: 420px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Credit scorecard</h1>
    <a href="/">← Back to FINN</a>
  </header>

  <section>
    <h2>Inputs</h2>
    <p class="note">Debt, cash and interest are not in the stored data. Enter them from the company's latest annual report, in Rs crore. Operating profit and profit figures come from the last four reported quarters.</p>
    <form id="credit-form">
      <label>Company (NSE symbol)<input id="ticker" value="INFY" autocomplete="off" required></label>
      <label>Total debt, Rs crore<input id="debt" type="number" min="0" step="any" required></label>
      <label>Cash and equivalents, Rs crore<input id="cash" type="number" min="0" step="any" value="0"></label>
      <label>Interest expense, last 12 months, Rs crore<input id="interest" type="number" min="0" step="any" value="0"></label>
      <button type="submit">Score</button>
    </form>
  </section>

  <div id="out"></div>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmt(value, suffix = "") {
  return value == null ? "—" : `${Number(value).toLocaleString("en-IN", { maximumFractionDigits: 2 })}${suffix}`;
}

function chart(sens) {
  const W = 320, H = 200, P = 34;
  const xs = sens.shocks_pct, x0 = xs[0], x1 = xs[xs.length - 1];
  const X = (v) => P + (v - x0) / (x1 - x0) * (W - P - 8);
  const Y = (s) => H - P - (s / 100) * (H - P - 10);
  const colors = ["#8aa4d6", "#1f3c88", "#c99a2e"];
  const bands = [35, 55, 75].map((v) =>
    `<line x1="${P}" x2="${W - 8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#b9c3d6" stroke-dasharray="4 4"/>
     <text x="2" y="${Y(v) + 4}" font-size="10" fill="#5b6b86">${v}</text>`).join("");
  const lines = sens.series.map((s, i) => {
    const points = s.scores.map((score, j) => `${X(xs[j]).toFixed(1)},${Y(score).toFixed(1)}`).join(" ");
    return `<polyline fill="none" stroke="${colors[i]}" stroke-width="2.5" points="${points}"/>`;
  }).join("");
  const labels = xs.filter((_, i) => i % 2 === 0).map((v) =>
    `<text x="${X(v)}" y="${H - 10}" font-size="10" text-anchor="middle" fill="#5b6b86">${v}%</text>`).join("");
  const legend = sens.series.map((s, i) =>
    `<text x="${P + i * 96}" y="14" font-size="11" fill="${colors[i]}">debt Rs ${fmt(s.debt)} cr</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Credit score against a change in EBITDA">
    ${bands}${lines}${labels}${legend}</svg>`;
}

function render(r) {
  const m = r.metrics;
  const rows = [
    ["Interest cover (EBITDA ÷ interest)", fmt(m.interest_cover_x, "x"), r.points.interest_cover, 30],
    ["Net debt ÷ EBITDA", fmt(m.net_debt_to_ebitda_x, "x"), r.points.leverage, 30],
    ["PAT margin", fmt(m.pat_margin_pct, "%"), r.points.pat_margin, 20],
    ["EBITDA trend vs prior year", fmt(m.ebitda_trend_pct, "%"), r.points.ebitda_trend, 20],
  ].map(([label, value, points, weight]) => `<tr><td>${esc(label)}</td><td class="num">${esc(value)}</td>
      <td class="num">${points} of 3 · ${weight} pts</td></tr>`).join("");
  $("#out").innerHTML = `
    <section>
      <h2>${esc(r.ticker)} · result</h2>
      <div class="rating"><span class="score">${fmt(r.score)}</span><span>out of 100</span>
        <span class="badge">${esc(r.rating)}</span></div>
      <p><strong>Underwriting view:</strong> ${esc(r.view)}</p>
      <p class="note">Net debt ${fmt(m.net_debt)} Rs crore · trailing EBITDA ${fmt(r.ttm.ebitda)} · trailing PAT ${fmt(r.ttm.pat)}</p>
      <table><thead><tr><th>Measure</th><th class="num">Value</th><th class="num">Points</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </section>
    <section>
      <h2>What if EBITDA falls?</h2>
      <p class="note">Each line keeps interest fixed and changes EBITDA by the shown amount. Lines show three debt levels: 75%, 100% and 125% of the figure entered.</p>
      ${chart(r.sensitivity)}
    </section>
    <section>
      <h2>Assumptions</h2>
      <ul>${r.assumptions.map((a) => `<li>${esc(a)}</li>`).join("")}</ul>
      <p class="note">Only EBITDA is shocked. PAT is held at its trailing figure, so the margin measure does not move in the chart.</p>
    </section>`;
}

$("#credit-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const ticker = $("#ticker").value.trim().toUpperCase();
  const query = new URLSearchParams({
    debt: $("#debt").value, cash: $("#cash").value || "0", interest: $("#interest").value || "0",
  });
  $("#out").innerHTML = `<section><p class="note">Scoring…</p></section>`;
  try {
    const resp = await fetch(`/api/company/${encodeURIComponent(ticker)}/credit?${query}`);
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      const detail = typeof body.detail === "string" ? body.detail : "Could not score this company.";
      $("#out").innerHTML = `<section><p class="note">${esc(detail)}</p></section>`;
      return;
    }
    render(await resp.json());
  } catch (err) {
    $("#out").innerHTML = `<section><p class="note">Could not reach the server: ${esc(err.message)}</p></section>`;
  }
});
</script>
</body>
</html>
